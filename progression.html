<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progression · Atelier Technologies WAN</title>
<script>try{var t=localStorage.getItem("atelier-wan-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=2">
<style>
.ph{padding:50px 0 26px}.ph h1{font-size:clamp(34px,4.6vw,56px);letter-spacing:-.04em;margin:12px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.kpi{padding:22px}.kpi small{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.kpi b{display:block;font-family:var(--mono);font-size:34px;letter-spacing:-.03em;margin:8px 0 10px}
.tbl{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td a{text-decoration:none;font-weight:600}td a:hover{color:var(--c)}
.tabsdots{display:flex;gap:4px}.tabsdots i{width:22px;height:6px;border-radius:3px;background:var(--line2)}.tabsdots i.on{background:var(--c)}
.sc{font-family:var(--mono)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.hist div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
window.PAGE=function(){
  const W=window.WAN, I=W.ICONS, $=W.$, esc=W.esc; W.shell("prog");
  const render=()=>{
  const d=W.store.all(), tps=W.sorted(), tabsN=6;
  const visited=tps.filter(t=>d.v&&d.v[t.id]).length;
  const tabsTot=tps.reduce((a,t)=>a+(d.t&&d.t[t.id]?Object.keys(d.t[t.id]).length:0),0);
  const qd=tps.filter(t=>d.q&&d.q[t.id]); const avg=qd.length?Math.round(qd.reduce((a,t)=>a+d.q[t.id].s/d.q[t.id].n,0)/qd.length*100):0;
  const glob=Math.round((tabsTot/(tps.length*tabsN))*100);
  const defis=(d.d||[]); const best=defis.reduce((m,h)=>Math.max(m,h.pts||0),0);
  const TABS=["theorie","topologie","simulation","commandes","quiz","correction"];
  $("#app").innerHTML=`<div class="ph"><div class="kicker">// tableau de bord</div><h1>Ma progression</h1><p class="muted">Enregistrée uniquement dans ce navigateur : rien n'est envoyé sur Internet.</p></div>
  <div class="kpis">
    <div class="card kpi"><small>Parcours</small><b>${glob}%</b><div class="bar"><i style="width:${glob}%"></i></div></div>
    <div class="card kpi"><small>TP ouverts</small><b>${visited}/${tps.length}</b><div class="bar"><i style="width:${visited/tps.length*100}%"></i></div></div>
    <div class="card kpi"><small>Moyenne aux quiz</small><b>${qd.length?avg+"%":"—"}</b><div class="bar"><i style="width:${avg}%"></i></div></div>
    <div class="card kpi"><small>Record défi</small><b>${best||"—"}</b><div class="muted" style="font-size:13px">${defis.length} défi${defis.length>1?"s":""} joué${defis.length>1?"s":""}</div></div>
  </div>
  <div class="card tbl"><table><thead><tr><th>TP</th><th>Thème</th><th>Onglets consultés</th><th>Meilleur quiz</th><th></th></tr></thead><tbody>
  ${tps.map(t=>{const th=W.THEMES[t.theme], tb=d.t&&d.t[t.id]||{}, q=d.q&&d.q[t.id];
    return `<tr style="--c:${th.c}"><td><a href="tp.html?id=${t.id}"><span class="mono" style="color:var(--c)">${String(t.order).padStart(2,"0")}</span> &nbsp;${esc(t.short)}</a><div class="muted" style="font-size:12.5px">${esc(t.num)}</div></td>
      <td><span class="tag c">${th.name}</span></td>
      <td><div class="tabsdots" title="${Object.keys(tb).join(", ")||"aucun"}">${TABS.map(k=>`<i class="${tb[k]?"on":""}"></i>`).join("")}</div></td>
      <td class="sc">${q?`<span style="color:${q.s/q.n>=.7?"var(--teal)":q.s/q.n>=.5?"var(--amber)":"var(--red)"}">${q.s}/${q.n}</span>`:'<span class="muted">—</span>'}</td>
      <td style="text-align:right"><a class="btn sm" href="tp.html?id=${t.id}${q?"#correction":tb.theorie?"#quiz":""}">${q?"Revoir":tb.theorie?"Faire le quiz":"Commencer"}</a></td></tr>`}).join("")}
  </tbody></table></div>
  <div class="two">
    <div class="card" style="padding:22px"><h3 style="margin:0 0 6px">Conseil</h3><p class="muted" style="margin:0">${(()=>{const todo=tps.find(t=>!(d.q&&d.q[t.id])); const weak=qd.filter(t=>d.q[t.id].s/d.q[t.id].n<.7);
      if(weak.length) return `Reprenez la théorie de <a href="tp.html?id=${weak[0].id}#theorie"><b>${esc(weak[0].short)}</b></a> : votre score y est sous 70 %.`;
      if(todo) return `Prochaine étape : <a href="tp.html?id=${todo.id}"><b>${esc(todo.num)} · ${esc(todo.short)}</b></a>.`;
      return `Tous les quiz sont faits. Tentez de battre votre record en <a href="defi.html"><b>mode défi</b></a>.`})()}</p>
      <button class="btn sm ghost" id="rst" style="margin-top:16px">Réinitialiser ma progression</button></div>
    <div class="card hist" style="padding:22px"><h3 style="margin:0 0 6px">Derniers défis</h3>${defis.length?defis.slice(0,6).map(h=>`<div><span>${new Date(h.at).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span><span class="mono">${h.s}/${h.n} · ${h.pts||0} pts</span></div>`).join(""):`<p class="muted">Aucun défi pour l'instant. <a href="defi.html">Lancer un défi</a></p>`}</div>
  </div>`;
  $("#rst").onclick=()=>{ if(confirm("Effacer toute la progression enregistrée dans ce navigateur ?")){W.store.reset(); render()} };
  };
  render();
};
</script>
<script src="assets/js/boot.js?v=2"></script>
</body>
</html>
